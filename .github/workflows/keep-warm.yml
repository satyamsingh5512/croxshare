name: Keep Render service warm

# Render's free tier spins the service down after 15 minutes of inactivity,
# causing a 30–60s cold start on the next request. This pings a lightweight
# health endpoint on a schedule so the instance stays awake.

on:
  schedule:
    # Every 10 minutes (comfortably under Render's 15-minute idle window).
    # Note: GitHub may delay scheduled runs during peak load, so keep the
    # interval well below 15 minutes.
    - cron: '*/10 * * * *'
  # Allow manual runs from the Actions tab for testing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::RENDER_APP_URL secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Strip any trailing slash, then hit the lightweight /healthz route.
          URL="${APP_URL%/}/healthz"
          echo "Pinging $URL"
          code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 60 --retry 3 --retry-delay 20 "$URL")
          echo "Response: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code from $URL"
            exit 1
          fi
